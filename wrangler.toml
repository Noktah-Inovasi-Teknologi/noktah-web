# https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Nitro merges this file into .output/server/wrangler.json at build time and
# `wrangler deploy` follows that generated config, so always build first.
# `main` and `assets` are deliberately absent: Nitro sets both, and warns if
# they appear here.
name = "noktah-web"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

# Runtime variables are Worker secrets, which survive deploys on their own. Do
# not add a [vars] entry with the same name as a secret. This stops a deploy
# deleting anything added as a plain variable in the dashboard.
keep_vars = true

# Both default to off or unset once `routes` is present, so a deploy would
# silently change them. Stated explicitly to keep them as they are live.
workers_dev = true
preview_urls = true

routes = [
  { pattern = "noktah.co", custom_domain = true },
  { pattern = "www.noktah.co/*", zone_name = "noktah.co" },
]
